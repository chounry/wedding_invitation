<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="40%" stop-color="#fbf0e4"/>
      <stop offset="100%" stop-color="#f3e2d3"/>
    </linearGradient>
    <radialGradient id="soft1" cx="20%" cy="15%" r="52%">
      <stop offset="0%" stop-color="#e7c6b6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e7c6b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soft2" cx="82%" cy="86%" r="52%">
      <stop offset="0%" stop-color="#c3cfae" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c3cfae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soft3" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#fffdf6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fffdf6" stop-opacity="0"/>
    </radialGradient>

    <!-- a soft painted rose -->
    <g id="rose">
      <circle r="46" fill="#e8bfae" opacity="0.55"/>
      <circle r="34" fill="#dfae9b" opacity="0.5"/>
      <g fill="none" stroke="#b9765a" stroke-width="3" stroke-linecap="round" opacity="0.85">
        <path d="M-24 -8 a26 26 0 1 1 34 20"/>
        <path d="M-14 -2 a16 16 0 1 1 21 12"/>
        <path d="M-6 2 a8 8 0 1 1 10 6"/>
      </g>
    </g>
    <!-- a leaf spray -->
    <g id="spray" fill="none" stroke="#8d9c78" stroke-width="3.2" stroke-linecap="round">
      <path d="M0 0 C46 -18 104 -26 158 -24"/>
      <path d="M34 -12 q-4 -26 12 -42 q18 24 -12 42"/>
      <path d="M74 -20 q-2 -27 15 -42 q17 25 -15 42"/>
      <path d="M116 -24 q0 -26 17 -40 q15 25 -17 40"/>
      <path d="M50 -8 q24 -8 44 4 q-26 14 -44 -4"/>
      <path d="M92 -14 q24 -6 43 7 q-27 13 -43 -7"/>
    </g>
    <g id="budCluster" fill="#d9a58f" opacity="0.75">
      <circle cx="0" cy="0" r="9"/><circle cx="18" cy="-8" r="7"/><circle cx="10" cy="15" r="6.5"/>
    </g>
  </defs>

  <rect width="1600" height="1200" fill="url(#wash)"/>
  <rect width="1600" height="1200" fill="url(#soft1)"/>
  <rect width="1600" height="1200" fill="url(#soft2)"/>

  <!-- thin gold frame -->
  <rect x="54" y="54" width="1492" height="1092" fill="none" stroke="#c9a875" stroke-width="1.6" opacity="0.55"/>
  <rect x="70" y="70" width="1460" height="1060" fill="none" stroke="#c9a875" stroke-width="0.9" opacity="0.35"/>

  <!-- TOP-LEFT garland -->
  <g>
    <use href="#spray" transform="translate(70,300) rotate(-30)"/>
    <use href="#spray" transform="translate(120,210) rotate(6) scale(0.9)"/>
    <use href="#spray" transform="translate(60,150) rotate(28) scale(0.8)"/>
    <use href="#rose" transform="translate(230,250) scale(1.15)"/>
    <use href="#rose" transform="translate(140,350) scale(0.85)"/>
    <use href="#rose" transform="translate(320,160) scale(0.7)"/>
    <use href="#budCluster" transform="translate(300,330)"/>
    <use href="#budCluster" transform="translate(90,430) scale(0.85)"/>
  </g>

  <!-- TOP-RIGHT garland (mirrored) -->
  <g transform="translate(1600,0) scale(-1,1)">
    <use href="#spray" transform="translate(70,300) rotate(-30)"/>
    <use href="#spray" transform="translate(120,210) rotate(6) scale(0.9)"/>
    <use href="#spray" transform="translate(60,150) rotate(28) scale(0.8)"/>
    <use href="#rose" transform="translate(230,250) scale(1.15)"/>
    <use href="#rose" transform="translate(140,350) scale(0.85)"/>
    <use href="#rose" transform="translate(320,160) scale(0.7)"/>
    <use href="#budCluster" transform="translate(300,330)"/>
    <use href="#budCluster" transform="translate(90,430) scale(0.85)"/>
  </g>

  <!-- BOTTOM-LEFT garland -->
  <g transform="translate(0,1200) scale(1,-1)">
    <use href="#spray" transform="translate(80,250) rotate(-24) scale(0.95)"/>
    <use href="#spray" transform="translate(130,170) rotate(10) scale(0.8)"/>
    <use href="#rose" transform="translate(215,215) scale(1.05)"/>
    <use href="#rose" transform="translate(120,300) scale(0.75)"/>
    <use href="#budCluster" transform="translate(290,270)"/>
  </g>

  <!-- BOTTOM-RIGHT garland -->
  <g transform="translate(1600,1200) scale(-1,-1)">
    <use href="#spray" transform="translate(80,250) rotate(-24) scale(0.95)"/>
    <use href="#spray" transform="translate(130,170) rotate(10) scale(0.8)"/>
    <use href="#rose" transform="translate(215,215) scale(1.05)"/>
    <use href="#rose" transform="translate(120,300) scale(0.75)"/>
    <use href="#budCluster" transform="translate(290,270)"/>
  </g>

  <!-- centre glow so the card stays legible -->
  <rect width="1600" height="1200" fill="url(#soft3)"/>

  <!-- drifting petals -->
  <g opacity="0.55">
    <ellipse cx="470" cy="300" rx="11" ry="6" fill="#d9a58f" transform="rotate(-28 470 300)"/>
    <ellipse cx="1140" cy="360" rx="10" ry="5.5" fill="#d9a58f" transform="rotate(22 1140 360)"/>
    <ellipse cx="560" cy="880" rx="9" ry="5" fill="#c9a875" transform="rotate(-12 560 880)"/>
    <ellipse cx="1060" cy="930" rx="9" ry="5" fill="#c9a875" transform="rotate(32 1060 930)"/>
    <ellipse cx="800" cy="200" rx="8" ry="4.5" fill="#d9a58f" transform="rotate(8 800 200)"/>
  </g>
</svg>
