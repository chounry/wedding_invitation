<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#fdf9f0"/>
      <stop offset="45%" stop-color="#f7ecdd"/>
      <stop offset="100%" stop-color="#efe0cb"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fffaf0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fffaf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush" cx="18%" cy="82%" r="45%">
      <stop offset="0%" stop-color="#e9c3b4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e9c3b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sage" cx="85%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#bcc9ab" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bcc9ab" stop-opacity="0"/>
    </radialGradient>
    <g id="leafSprig" fill="none" stroke="#b8901f" stroke-width="3.5" stroke-linecap="round">
      <path d="M0 0 C40 -30 90 -45 140 -48"/>
      <path d="M28 -20 q-6 -26 8 -44 q20 20 -8 44"/>
      <path d="M62 -34 q-4 -27 12 -44 q19 22 -12 44"/>
      <path d="M100 -44 q-2 -27 14 -43 q18 23 -14 43"/>
      <path d="M40 -18 q22 -6 40 6 q-24 12 -40 -6"/>
      <path d="M80 -30 q22 -4 39 9 q-25 11 -39 -9"/>
    </g>
    <g id="bloom" fill="none" stroke="#c58f7a" stroke-width="3.5">
      <circle r="10"/>
      <circle cx="0" cy="-24" r="12"/><circle cx="23" cy="-7" r="12"/>
      <circle cx="14" cy="20" r="12"/><circle cx="-14" cy="20" r="12"/><circle cx="-23" cy="-7" r="12"/>
    </g>
  </defs>

  <rect width="1600" height="1200" fill="url(#hbg)"/>
  <rect width="1600" height="1200" fill="url(#sage)"/>
  <rect width="1600" height="1200" fill="url(#blush)"/>
  <rect width="1600" height="1200" fill="url(#glowA)"/>

  <!-- soft arch outline behind the centre -->
  <path d="M800 190 C1010 190 1130 350 1130 560 L1130 1000 L470 1000 L470 560 C470 350 590 190 800 190 Z"
        fill="none" stroke="#c9a875" stroke-width="2.5" opacity="0.45"/>
  <path d="M800 232 C988 232 1092 376 1092 566 L1092 1000 L508 1000 L508 566 C508 376 612 232 800 232 Z"
        fill="none" stroke="#c9a875" stroke-width="1.4" opacity="0.3"/>

  <!-- botanical corners -->
  <g opacity="0.85">
    <use href="#leafSprig" transform="translate(60,300) rotate(12)"/>
    <use href="#leafSprig" transform="translate(90,430) rotate(-14) scale(0.85)"/>
    <use href="#leafSprig" transform="translate(1540,300) rotate(168) "/>
    <use href="#leafSprig" transform="translate(1512,432) rotate(194) scale(0.85)"/>
    <use href="#leafSprig" transform="translate(70,1010) rotate(-22) scale(0.95)"/>
    <use href="#leafSprig" transform="translate(1532,1010) rotate(202) scale(0.95)"/>
  </g>

  <!-- blossoms -->
  <g opacity="0.8">
    <use href="#bloom" transform="translate(214,352) scale(1.05)"/>
    <use href="#bloom" transform="translate(150,470) scale(0.8)"/>
    <use href="#bloom" transform="translate(1390,352) scale(1.05)"/>
    <use href="#bloom" transform="translate(1452,472) scale(0.8)"/>
    <use href="#bloom" transform="translate(198,1052) scale(0.9)"/>
    <use href="#bloom" transform="translate(1404,1052) scale(0.9)"/>
  </g>

  <!-- drifting petals / dots -->
  <g fill="#c9a875" opacity="0.5">
    <circle cx="330" cy="180" r="5"/><circle cx="1280" cy="200" r="5"/>
    <circle cx="420" cy="880" r="4"/><circle cx="1190" cy="900" r="4"/>
    <circle cx="640" cy="130" r="4"/><circle cx="980" cy="150" r="4"/>
    <circle cx="270" cy="700" r="4"/><circle cx="1340" cy="720" r="4"/>
  </g>
  <g fill="#d9b8a3" opacity="0.55">
    <ellipse cx="520" cy="260" rx="9" ry="5" transform="rotate(-25 520 260)"/>
    <ellipse cx="1100" cy="300" rx="9" ry="5" transform="rotate(20 1100 300)"/>
    <ellipse cx="700" cy="960" rx="8" ry="4.5" transform="rotate(-15 700 960)"/>
    <ellipse cx="960" cy="1010" rx="8" ry="4.5" transform="rotate(28 960 1010)"/>
  </g>
</svg>
