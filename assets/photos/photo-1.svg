<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#fdf8ec"/>
      <stop offset="100%" stop-color="#f1e4c6"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg1)"/>
  <g fill="#c9a875" opacity="0.55">
    <circle cx="180" cy="200" r="5"/><circle cx="840" cy="240" r="6"/>
    <circle cx="150" cy="770" r="6"/><circle cx="860" cy="800" r="5"/>
    <circle cx="500" cy="120" r="4"/><circle cx="250" cy="500" r="4"/><circle cx="760" cy="560" r="4"/>
  </g>
  <circle cx="500" cy="500" r="300" fill="none" stroke="#c9a875" stroke-width="2" opacity="0.55"/>
  <!-- interlocked rings -->
  <g fill="none" stroke="#b8901f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="440" cy="540" r="120"/>
    <circle cx="580" cy="540" r="120"/>
    <!-- solitaire diamond on left ring -->
    <path d="M440 388 L474 420 L440 470 L406 420 Z"/>
